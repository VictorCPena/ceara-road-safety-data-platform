services:
  redpanda:
    image: redpandadata/redpanda:v24.2.9
    command: [redpanda, start, --smp, '1', --memory, 512M, --overprovisioned, --node-id, '0', --kafka-addr, 'internal://0.0.0.0:9092,external://0.0.0.0:19092', --advertise-kafka-addr, 'internal://redpanda:9092,external://localhost:19092']
    ports: ['127.0.0.1:19092:19092']
    volumes: [redpanda-data:/var/lib/redpanda/data]
volumes:
  redpanda-data:
