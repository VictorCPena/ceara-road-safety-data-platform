name: CI

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  validate:
    name: Validate Data Platform

    runs-on: ubuntu-latest

    env:
      DATA_DIR: ./.ci/data
      METADATA_DIR: ./.ci/metadata

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare isolated fixture runtime
        run: |
          rm -rf .ci

          mkdir -p .ci/data
          mkdir -p .ci/data/warehouse
          mkdir -p .ci/metadata

          cp -R tests/fixtures/silver .ci/data/silver

      - name: Show fixture structure
        run: |
          find .ci/data/silver -type f | sort

      - name: Validate Docker Compose
        run: |
          docker compose config --quiet

      - name: Build pipeline image
        run: |
          docker compose build

      - name: Validate Python syntax
        run: |
          docker compose run --rm pipeline \
            python -m compileall -q src

      - name: Run dbt build against fixture data
        run: |
          docker compose run --rm pipeline \
            dbt build \
            --project-dir analytics \
            --profiles-dir analytics
