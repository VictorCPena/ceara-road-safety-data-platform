name: CI

on:
  push:
    branches:
      - main

  pull_request:

jobs:

  data-platform:
    name: Validate Data Platform
    runs-on: ubuntu-latest

    env:
      DATA_DIR: ./.ci/data
      METADATA_DIR: ./.ci/metadata

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare fixture runtime
        run: |
          rm -rf .ci

          mkdir -p .ci/data
          mkdir -p .ci/data/warehouse
          mkdir -p .ci/metadata

          cp -R tests/fixtures/silver .ci/data/silver

      - name: Validate Docker Compose
        run: |
          docker compose config --quiet

      - name: Build pipeline image
        run: |
          docker compose build pipeline

      - name: Validate Python syntax
        run: |
          docker compose run --rm pipeline \
            python -m compileall -q src

      - name: Run dbt build against fixture data
        run: |
          docker compose run --rm pipeline \
            dbt build \
            --project-dir analytics \
            --profiles-dir analytics


  airflow:
    name: Validate Airflow
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate DAG Python syntax
        run: |
          python -m compileall -q orchestration/dags

      - name: Build Airflow image
        run: |
          docker build \
            -f Dockerfile.airflow \
            -t ceara-road-safety-airflow-ci \
            .

      - name: Validate Airflow DAG imports
        run: |
          docker run --rm \
            -e AIRFLOW_HOME=/tmp/airflow \
            -e AIRFLOW__CORE__LOAD_EXAMPLES=false \
            -e AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags \
            -e AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////tmp/airflow/airflow.db \
            -v "${{ github.workspace }}/orchestration/dags:/opt/airflow/dags:ro" \
            ceara-road-safety-airflow-ci \
            bash -lc '
              set -e

              airflow db migrate >/dev/null

              airflow dags list-import-errors \
                --local \
                --output=json > /tmp/import-errors.json

              cat /tmp/import-errors.json

              python - <<'"'"'PY'"'"'
          import json

          with open("/tmp/import-errors.json") as file:
              errors = json.load(file)

          if errors:
              raise SystemExit(
                  f"Airflow DAG import errors found: {errors}"
              )

          print("Airflow DAG imports: OK")
          PY
            '

      - name: Verify expected DAG exists
        run: |
          docker run --rm \
            -e AIRFLOW_HOME=/tmp/airflow \
            -e AIRFLOW__CORE__LOAD_EXAMPLES=false \
            -e AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags \
            -e AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////tmp/airflow/airflow.db \
            -v "${{ github.workspace }}/orchestration/dags:/opt/airflow/dags:ro" \
            ceara-road-safety-airflow-ci \
            bash -lc '
              set -e

              airflow db migrate >/dev/null

              airflow dags list \
                --local \
                --output=plain |
                grep -q "ceara_road_safety_full_pipeline"

              echo "Expected Airflow DAG found."
            '