name: Portfolio validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r requirements-portfolio.txt
      - run: python -m pip check
      - run: python -m ruff check lakehouse tests/test_pro_*.py tests/test_airflow_pro.py tests/test_observability.py tests/test_stream_commit_recovery.py monitoring/server.py scripts/check_observability.py
      - run: python -m pytest -q
