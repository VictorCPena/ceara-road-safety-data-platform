global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/lakehouse-monitoring/alerts.yml

scrape_configs:
  - job_name: lakehouse-airflow
    metrics_path: /metrics
    static_configs:
      - targets: ['exporter:9108']
